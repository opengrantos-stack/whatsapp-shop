<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="cabecalho">
    <img id="logoLoja" class="logo-loja" src="" alt="Logo da loja">
    <h1 id="nomeLoja">Minha Loja</h1>
    <p id="descricaoLoja"></p>
</header>

<main class="container">

    <section>
        <h2>Produtos e Serviços</h2>
        <div id="listaProdutos" class="produtos"></div>
    </section>

    <section class="carrinho">
        <h2>Meu Pedido</h2>

        <div id="listaCarrinho">
            <p class="carrinho-vazio">
                O seu pedido está vazio.
            </p>
        </div>

        <div id="total" class="total">
            Total: 0 Kz
        </div>

        <button
            id="btnWhatsApp"
            class="btn btn-whatsapp"
            style="display:none;">
            Finalizar pedido pelo WhatsApp
        </button>
    </section>

</main>

<script src="config.js"></script>
<script src="products.js"></script>
<script src="script.js"></script>

</body>
</html>
