<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="cabecalho">
    <img src="images/logo.png" alt="Logo da loja" class="logo">
    <h1 id="nomeLoja">Minha Loja</h1>
    <p id="descricaoLoja"></p>
</header>

<main class="container">

    <section class="secao-loja">
        <button id="btnProdutos" class="btn-secao" type="button">
            PRODUTOS E SERVIÇOS
            <span id="setaProdutos">▼</span>
        </button>

        <div id="listaProdutos" class="produtos fechado"></div>
    </section>

    <section class="carrinho">
        <button id="btnPedido" class="btn-secao" type="button">
            MEU PEDIDO
            <span id="setaPedido">▼</span>
        </button>

        <div id="conteudoPedido" class="conteudo-pedido fechado">

            <div id="listaCarrinho">
                <p class="carrinho-vazio">
                    O seu pedido está vazio.
                </p>
            </div>

            <div id="total" class="total">
                Total: 0 Kz
            </div>

            <button
                id="btnWhatsApp"
                class="btn btn-whatsapp"
                style="display:none;">
                Finalizar pedido pelo WhatsApp
            </button>

        </div>
    </section>

</main>

<script src="config.js"></script>
<script src="products.js"></script>
<script src="script.js"></script>

<script>
    const btnProdutos = document.getElementById("btnProdutos");
    const listaProdutos = document.getElementById("listaProdutos");
    const setaProdutos = document.getElementById("setaProdutos");

    btnProdutos.addEventListener("click", function () {
        listaProdutos.classList.toggle("fechado");

        setaProdutos.textContent =
            listaProdutos.classList.contains("fechado") ? "▼" : "▲";
    });

    const btnPedido = document.getElementById("btnPedido");
    const conteudoPedido = document.getElementById("conteudoPedido");
    const setaPedido = document.getElementById("setaPedido");

    btnPedido.addEventListener("click", function () {
        conteudoPedido.classList.toggle("fechado");

        setaPedido.textContent =
            conteudoPedido.classList.contains("fechado") ? "▼" : "▲";
    });
</script>

</body>
</html>
