plugins { id 'com.android.application' }

android {
    namespace 'ao.geracaocalueio.gcangglobal'
    compileSdk 36

    defaultConfig {
        applicationId 'ao.geracaocalueio.gcangglobal'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
