name: Build GC-AngGlobal Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Verificar APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -s android/app/build/outputs/apk/debug/*.apk

      - name: Publicar APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-debug-${{ github.run_number }}
          name: GC-AngGlobal Android ${{ github.run_number }}
          body: |
            APK de teste da aplicação GC-AngGlobal.
            Commit: ${{ github.sha }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
